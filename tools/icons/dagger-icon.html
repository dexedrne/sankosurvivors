<!doctype html><meta charset="utf-8"><title>Dagger item icon</title>
<!-- Draws public/assets/ui/items/item_Dagger.png from the original SankoQuest model (models/environment/hand_dagger.glb):
     a fixed camera and lights, no smoothing, then the one-pixel dark outline the other item icons have.
     Run by tools/icons/render-dagger-icon.sh in the QA browser on the build box; nothing here is random. -->
<body style="margin:0;background:#444"><canvas id="gl" width="64" height="64"></canvas><canvas id="out" width="64" height="64"></canvas>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './jsm/loaders/GLTFLoader.js';
const S = 64, renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), alpha: true, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(S, S, false); renderer.setClearColor(0x000000, 0); renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 2.6));
const key = new THREE.DirectionalLight(0xffffff, 3.4); key.position.set(-2, 3, 4); scene.add(key);
const gltf = await new GLTFLoader().loadAsync('./hand_dagger.glb');
const model = gltf.scene, box = new THREE.Box3().setFromObject(model), centre = box.getCenter(new THREE.Vector3());
model.position.sub(centre);
const turn = new THREE.Group(); turn.add(model); turn.rotation.set(0, 0.35, -Math.PI / 4, 'ZYX'); scene.add(turn); // the point up and to the right
const fit = new THREE.Box3().setFromObject(turn), size = fit.getSize(new THREE.Vector3()), mid = fit.getCenter(new THREE.Vector3());
const half = Math.max(size.x, size.y) / 2 * (S / (S - 8)); // a four-pixel margin for the outline
const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.01, 100); camera.position.set(mid.x, mid.y, mid.z + 20); camera.lookAt(mid);
renderer.render(scene, camera);
const out = document.getElementById('out').getContext('2d'); out.drawImage(renderer.domElement, 0, 0);
const img = out.getImageData(0, 0, S, S), d = img.data, solid = new Uint8Array(S * S);
for (let i = 0; i < S * S; i++) { solid[i] = d[i * 4 + 3] >= 128 ? 1 : 0; d[i * 4 + 3] = solid[i] ? 255 : 0; }
for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
  const i = y * S + x; if (solid[i]) continue;
  if ((x > 0 && solid[i - 1]) || (x < S - 1 && solid[i + 1]) || (y > 0 && solid[i - S]) || (y < S - 1 && solid[i + S])) { d[i * 4] = 24; d[i * 4 + 1] = 20; d[i * 4 + 2] = 22; d[i * 4 + 3] = 255; }
}
out.putImageData(img, 0, 0);
window.__icon = document.getElementById('out').toDataURL('image/png');
window.__iconInfo = { size: size.toArray().map((v) => +v.toFixed(3)), solid: solid.reduce((a, v) => a + v, 0) };
window.__sqReady = true;
</script>
